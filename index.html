        }
        .info-row label {

            color: #1f2a36;
            margin-right: 6px;
        }
        .info-row select, .info-row input {

            border-radius: 30px;
            border: 1px solid #bcc9d6;
            background: white;
            font-size: 1rem;
            min-width: 160px;

        .info-row .campo {

            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .info-row .campo span {
            background: white;
            padding: 6px 16px;
            border-radius: 30px;
            border: 1px solid #bcc9d6;
            min-width: 120px;
        }
        .question {
            background: #f8faff;

            margin-bottom: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
        }

            max-width: 100%;
            width: 100%;
            max-height: 480px;
            object-fit: contain;
            margin: 10px 0 12px;
            border-radius: 12px;
            border: 1px solid #dde3ed;
            display: block;
            cursor: zoom-in;
            transition: transform 0.15s ease, box-shadow 0.15s ease;
            background: #f4f7fb;
        }
        .question img:hover {
            transform: scale(1.01);
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .img-hint {
            font-size: 0.8rem;
            color: #5c7393;
            margin: -6px 0 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .question p {
            font-weight: 500;
            margin: 0 0 10px;
            font-size: 1.05rem;
        }
        .alternativas {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin: 10px 0 6px;
        }
        .alternativas label {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #f2f6fc;
            padding: 10px 16px;
            border-radius: 40px;
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid #d0dceb;
            box-shadow: 0 4px 0 #b0c4d8, 0 2px 6px rgba(0,0,0,0.1);
            position: relative;
            top: 0;
            font-weight: 500;
            color: #1f2a36;
        }
        .alternativas label:hover {
            background: #e3ecf9;
            border-color: #a0bddb;
        }
        .alternativas label.selecionada {
            background: #1a6b3c !important;
            color: white !important;
            font-weight: 700 !important;
            border-color: #0f4a2a !important;
            box-shadow: 0 1px 0 #0f4a2a, 0 1px 4px rgba(0,0,0,0.2) !important;
            top: 3px !important;
        }
        .alternativas label.selecionada span {
            color: white !important;
            font-weight: 700 !important;
        }

            width: 18px;
            height: 18px;
            flex-shrink: 0;

            outline: 2px solid #2a7de1;
            border-color: transparent;
        }
        .btn-enviar {
            background: #1f5f9e;
            color: white;
            border: none;
            font-size: 1.3rem;
            font-weight: 600;
            padding: 16px 32px;

        }

            justify-content: center;

        }

        }

    // ================================================================
    // RENDERIZA QUESTÕES
    // ================================================================
    function renderQuestoes() {
        const container = document.getElementById('questoesContainer');
        container.innerHTML = '';
        questoes.forEach((q, idx) => {
            const div = document.createElement('div');
            div.className = 'question';
            let html = `<div class="badge-aula">Aula ${q.aula}</div>`;
            html += `<p><strong>Questão ${idx+1}</strong> – ${q.tipo === 'multipla' ? 'Múltipla escolha' : 'Dissertativa'}</p>`;
            html += `<p>${q.enunciado}</p>`;
            if (q.imagem) {
                html += `<img src="${q.imagem}" alt="Imagem ilustrativa da questão" loading="lazy" onclick="ampliarImagem('${q.imagem}')">`;
                html += `<div class="img-hint">🔍 Clique na imagem para ampliar</div>`;
            }
            if (q.tipo === 'multipla') {
                html += `<div class="alternativas" id="alternativas_${idx}">`;
                q.alternativas.forEach((alt, i) => {
                    html += `
                        <label for="q${idx}_${i}" onclick="selecionarAlternativa(${idx}, ${i})">
                            <input type="radio" name="q${idx}" id="q${idx}_${i}" value="${i}">
                            <span>${String.fromCharCode(65 + i)} - ${alt}</span>
                        </label>
                    `;
                });
                html += `</div>`;
            } else {
                html += `<div class="dissertativa"><textarea id="dissertativa_${idx}" placeholder="Escreva sua resposta aqui..."></textarea></div>`;
            }
            div.innerHTML = html;
            container.appendChild(div);
        });
    }

    // ================================================================
    // LIGHTBOX - AMPLIAR / FECHAR IMAGEM
    // ================================================================
    function ampliarImagem(src) {
        const overlay = document.getElementById('lightboxOverlay');
        const img = document.getElementById('lightboxImg');
        img.src = src;
        overlay.classList.add('visible');
        document.body.style.overflow = 'hidden';
    }

    function fecharImagem(event) {
        // Evita fechar quando clica na própria imagem ampliada (exceto pelo botão X, que também deve fechar)
        if (event && event.target.id === 'lightboxImg') return;
        const overlay = document.getElementById('lightboxOverlay');
        overlay.classList.remove('visible');
        document.body.style.overflow = '';
    }

    // Fecha o lightbox com a tecla ESC
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            fecharImagem();
        }
    });

    // ================================================================
    // FUNÇÃO PARA SELECIONAR ALTERNATIVA
    // ================================================================
    function selecionarAlternativa(questaoIndex, alternativaIndex) {
        const container = document.getElementById(`alternativas_${questaoIndex}`);
        if (!container) return;

        const labels = container.querySelectorAll('label');
        labels.forEach(label => {
            label.classList.remove('selecionada');
        });

        const labelClicada = labels[alternativaIndex];
        if (labelClicada) {
            labelClicada.classList.add('selecionada');
            const radio = labelClicada.querySelector('input[type="radio"]');
            if (radio) {
                radio.checked = true;
            }
        }
    }

    // ================================================================
    // FUNÇÕES DE CARREGAMENTO DE ALUNOS
    // ================================================================
    function carregarNomes() {
        const turma = document.getElementById('selectTurma').value;
        const selectNome = document.getElementById('selectNome');
        selectNome.innerHTML = '<option value="">Selecione um aluno</option>';
        if (turma && alunosPorTurma[turma]) {
            alunosPorTurma[turma].forEach(aluno => {
                const opt = document.createElement('option');
                opt.value = aluno.nome;
                opt.textContent = aluno.nome;
                selectNome.appendChild(opt);
            });
        }
        document.getElementById('spanRA').textContent = '-';
        document.getElementById('spanEmail').textContent = '-';
    }

    function carregarDadosAluno() {
        const turma = document.getElementById('selectTurma').value;
        const nome = document.getElementById('selectNome').value;
        if (turma && nome) {
            const aluno = alunosPorTurma[turma].find(a => a.nome === nome);
            if (aluno) {
                document.getElementById('spanRA').textContent = aluno.ra + (aluno.dig ? `-${aluno.dig}` : '');
                document.getElementById('spanEmail').textContent = aluno.email;
                return;
            }
        }
        document.getElementById('spanRA').textContent = '-';
        document.getElementById('spanEmail').textContent = '-';
    }

    // ================================================================
    // ENVIO PARA PLANILHA - VERSÃO CORRIGIDA COM LOGGING
    // ================================================================
    function enviarRespostas() {
        const turma = document.getElementById('selectTurma').value;
        const nome = document.getElementById('selectNome').value;
        const ra = document.getElementById('spanRA').textContent;
        const email = document.getElementById('spanEmail').textContent;

        if (!turma || !nome) {
            alert('Por favor, selecione sua turma e nome antes de enviar.');
            return;
        }

        // Coleta as respostas com validação
        const respostas = [];
        questoes.forEach((q, idx) => {
            if (q.tipo === 'multipla') {
                const selected = document.querySelector(`input[name="q${idx}"]:checked`);
                const resposta = selected ? selected.value : '';
                respostas.push(resposta);
                console.log(`Q${idx+1} (múltipla): ${resposta}`);
            } else {
                const textarea = document.getElementById(`dissertativa_${idx}`);
                const resposta = textarea ? textarea.value.trim() : '';
                respostas.push(resposta);
                console.log(`Q${idx+1} (dissertativa): ${resposta.substring(0, 50)}...`);
            }
        });

       const payload = {
    atividade: 'celula6wms_cito',   // <-- adicionar esta linha
    turma: turma,
    nome: nome,
    ra: ra,
    email: email,
    respostas: respostas,
    timestamp: new Date().toISOString()
};

        console.log('Payload a enviar:', JSON.stringify(payload, null, 2));

        const btnEnviar = document.getElementById('btnEnviar');
        const feedback = document.getElementById('feedback');

        btnEnviar.disabled = true;
        feedback.textContent = '⏳ Enviando respostas...';
        feedback.className = 'feedback visible carregando';

        // ⚠️ IMPORTANTE: SUBSTITUA PELA URL DO SEU APPS SCRIPT (após publicar como Web App)
        const scriptURL = 'https://script.google.com/macros/s/AKfycbwIBSVoMrOMURCzdT-6-PPTVk9IlIr2aoNwfPYus8sZp1dhAO5wpETSGtyEes_8bvj0/exec';

        fetch(scriptURL, {
            method: 'POST',
            headers: {
                'Content-Type': 'text/plain;charset=utf-8'
            },
            body: JSON.stringify(payload)
        })
        .then(response => {
            console.log('Status HTTP:', response.status);
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}: ${response.statusText}`);
            }
            return response.text(); // Tenta ler como texto primeiro
        })
        .then(text => {
            console.log('Resposta do servidor (texto):', text);
            // Tenta fazer parse como JSON
            try {
                const data = JSON.parse(text);
                if (data.success) {
                    feedback.textContent = '✅ Respostas enviadas com sucesso!';
                    feedback.className = 'feedback visible sucesso';
                    btnEnviar.disabled = true;
                    btnEnviar.textContent = '✅ Respostas enviadas';
                } else {
                    throw new Error(data.error || 'Erro desconhecido no servidor');
                }
            } catch (parseError) {
                console.error('Erro ao fazer parse da resposta:', parseError);
                feedback.textContent = '✅ Respostas enviadas! (Resposta: ' + text.substring(0, 50) + ')';
                feedback.className = 'feedback visible sucesso';
                btnEnviar.disabled = true;
                btnEnviar.textContent = '✅ Respostas enviadas';
            }
        })
        .catch(error => {
            console.error('Erro detalhado:', error);
            console.error('Stack:', error.stack);
            feedback.textContent = '❌ Erro: ' + error.message;
            feedback.className = 'feedback visible erro';
            btnEnviar.disabled = false;
        });
    }

    // ================================================================
    // INICIALIZA
    // ================================================================
    renderQuestoes();
    console.log('Formulário carregado. Total de questões:', questoes.length);
</script>
